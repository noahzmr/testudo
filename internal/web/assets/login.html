<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Testudo · sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <meta name="theme-color" content="#0b0f14">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: var(--sp-4);
      background:
        radial-gradient(70% 90% at 50% -10%, rgba(60, 199, 184, 0.12), transparent 60%),
        var(--bg);
    }
    .login-card {
      width: min(46rem, 100%);
      padding: var(--sp-8) var(--sp-8) var(--sp-6);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-pop);
    }
    /* The CLI boot banner as a vector wordmark. Each line carries its exact
       column count as textLength, so the 85-column ASCII grid stays aligned
       in whatever mono font is available and scales crisply with the card -
       no tiny <pre> type, no glow smear. */
    .login-banner {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 var(--sp-5);
      color: var(--brand);
    }
    .login-banner text {
      font: 600 20px var(--font-mono);
      fill: currentColor;
      white-space: pre;
    }
    /* Terminal boot: the six lines print top to bottom, then hold. */
    .login-banner .l {
      opacity: 0;
      animation: boot 0.42s ease-out forwards;
      animation-delay: calc(var(--i) * 70ms);
    }
    @keyframes boot {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .login-banner .l { animation: none; opacity: 1; }
    }
    .login-sub {
      margin: 0 0 var(--sp-6);
      text-align: center;
      color: var(--fg-dim);
      font-size: var(--fs-md);
      letter-spacing: 0.01em;
    }
    .login-sub .mono { color: var(--fg-faint); }
    .login-card form { display: grid; gap: var(--sp-4); }
    .login-card label {
      display: grid;
      gap: var(--sp-1);
      font-size: var(--fs-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fg-dim);
    }
    .login-card label .hint {
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
      color: var(--fg-faint);
    }
    .login-card input { font-size: var(--fs-base); padding: 10px 12px; }
    .login-card input[name="code"] {
      font-family: var(--font-mono);
      letter-spacing: 0.18em;
      max-width: 14ch;
    }
    .login-card button {
      margin-top: var(--sp-1);
      min-height: 44px;
      padding: 11px;
      font-size: var(--fs-base);
    }
    .err-line {
      min-height: 1.4em;
      text-align: center;
      font-size: var(--fs-md);
      color: var(--accent-red);
    }
    .err-line:empty { display: none; }
    @media (max-width: 640px) {
      .login-card { padding: var(--sp-6) var(--sp-5) var(--sp-5); }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <svg class="login-banner" viewBox="0 0 1020 144" role="img" aria-label="Testudo">
      <text class="l" style="--i:0" x="0" y="18" textLength="984" lengthAdjust="spacing" xml:space="preserve">      ___    __________ ________   ______ __________  __   __   _______     ______</text>
      <text class="l" style="--i:1" x="0" y="42" textLength="1008" lengthAdjust="spacing" xml:space="preserve"> ,,  // \\   \__    __/ |  ____/  /  ___/ \__    __/ |  | |  | |   ___  \  /  __   \</text>
      <text class="l" style="--i:2" x="0" y="66" textLength="1020" lengthAdjust="spacing" xml:space="preserve">(_,\/ \_/ \     |  |    |  |___   \  \       |  |    |  | |  | |  |   \  \ |  |  |  |</text>
      <text class="l" style="--i:3" x="0" y="90" textLength="1020" lengthAdjust="spacing" xml:space="preserve">  \ \_/_\_/&gt;    |  |    |   ___|   \  \      |  |    |  | |  | |  |   |  | |  |  |  |</text>
      <text class="l" style="--i:4" x="0" y="114" textLength="1020" lengthAdjust="spacing" xml:space="preserve">  /_/  /_/      |  |    |  |_____  /  /      |  |    |  |_|  | |  |___/  / |  |__|  |</text>
      <text class="l" style="--i:5" x="0" y="138" textLength="1008" lengthAdjust="spacing" xml:space="preserve">                |__|    |_______/ /__/       |__|     \_____/  |________/   \______/</text>
    </svg>
    <p class="login-sub">Network observability &amp; operations console</p>
    <form method="post" action="/login">
      <label>Username
        <input name="username" autocomplete="username" spellcheck="false" value="{{.Username}}" {{if not .NeedCode}}autofocus{{end}}>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password">
      </label>
      <label><span>One-time code <span class="hint">· only if MFA is enrolled</span></span>
        <input name="code" inputmode="numeric" pattern="[0-9 ]*" autocomplete="one-time-code" placeholder="000 000" {{if .NeedCode}}autofocus{{end}}>
      </label>
      <button type="submit" class="btn btn-go">Sign in</button>
      <div class="err-line" role="alert">{{.Error}}</div>
    </form>
  </main>
</body>
</html>
