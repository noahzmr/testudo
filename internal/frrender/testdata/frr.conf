frr defaults traditional
hostname fw1
log syslog informational
service integrated-vtysh-config
!
ip route 0.0.0.0/0 198.51.100.1 wan0
ip route 0.0.0.0/0 203.0.113.1 wan1
ip route 0.0.0.0/0 203.0.113.1 wan1 table 20016
ip route 0.0.0.0/0 203.0.113.254 wan1 table 300
ip route 10.20.0.0/16 10.0.0.254 lan0 20
ip route 10.60.0.0/16 10.50.0.1 tenant0 vrf blue
ipv6 route ::/0 2001:db8:a::1 wan0
!
route-map rr-client-in permit 10
exit
route-map rr-client-out permit 10
exit
ip prefix-list transit-in seq 5 permit 0.0.0.0/0
ip prefix-list transit-out seq 5 permit 192.0.2.0/24
ipv6 prefix-list transit-out seq 5 permit 2001:db8:100::/48
route-map transit-in permit 10
 match ip address prefix-list transit-in
exit
route-map transit-out permit 10
 match ip address prefix-list transit-out
 set community 65001:100 no-export additive
 set large-community 65001:1:2 additive
exit
route-map transit-out permit 20
 match ipv6 address prefix-list transit-out
 set community 65001:100 no-export additive
 set large-community 65001:1:2 additive
exit
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 neighbor 2001:db8:ffff::2 remote-as 65001
 neighbor 2001:db8:ffff::2 description rr-client
 neighbor 198.51.100.1 remote-as 64500
 neighbor 198.51.100.1 description transit
 neighbor 198.51.100.1 update-source wan0
 neighbor 198.51.100.1 bfd
 neighbor 198.51.100.1 password s3cret
 neighbor 198.51.100.1 timers 30 90
 address-family ipv4 unicast
  network 192.0.2.0/24
  neighbor 198.51.100.1 activate
  neighbor 198.51.100.1 route-map transit-in in
  neighbor 198.51.100.1 route-map transit-out out
  maximum-paths 8
  maximum-paths ibgp 8
 exit-address-family
 address-family ipv6 unicast
  network 2001:db8:100::/48
  neighbor 2001:db8:ffff::2 activate
  neighbor 2001:db8:ffff::2 route-map rr-client-in in
  neighbor 2001:db8:ffff::2 route-map rr-client-out out
  neighbor 2001:db8:ffff::2 route-reflector-client
  neighbor 198.51.100.1 activate
  neighbor 198.51.100.1 route-map transit-in in
  neighbor 198.51.100.1 route-map transit-out out
  maximum-paths 8
  maximum-paths ibgp 8
 exit-address-family
exit
!
interface lan0
 ip ospf area 0.0.0.0
exit
interface wan1
 ip ospf area 51
exit
router ospf
 ospf router-id 10.0.0.1
 area 51 stub
exit
!
interface lan0
 ipv6 ospf6 area 0.0.0.0
exit
router ospf6
 ospf6 router-id 10.0.0.1
exit
!
bfd
exit
!
